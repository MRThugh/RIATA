[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riata"
version = "0.1.1"
description = "Deterministic, extensible, rule-based Linux desktop Intent Assistant supporting Persian and English."
readme = "README.md"
authors = [
  { name = "Ali Kamrani", email = "kamrani.exe@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["desktop-assistant", "intent-engine", "nlp", "linux", "pyside6", "persian"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
]
dependencies = [
  "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/MRThugh/RIATA"
Repository = "https://github.com/MRThugh/RIATA"
Issues = "https://github.com/MRThugh/RIATA/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
