name: RIATA Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Safety confirmation (type 'release' to proceed)"
        required: true
        default: "release"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Validate Release Trigger & Branch
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          echo "============================================================"
          echo "RIATA RELEASE AUTOMATION PIPELINE"
          echo "Author: Ali Kamrani (MRThugh)"
          echo "============================================================"
          
          # 1. Verify confirmation token
          if [ "${CONFIRM_RELEASE}" != "release" ]; then
            echo "::error::Release aborted: confirmation phrase '${CONFIRM_RELEASE}' does not match required value 'release'."
            exit 1
          fi
          
          # 2. Verify target branch
          CURRENT_REF="${{ github.ref }}"
          if [ "${CURRENT_REF}" != "refs/heads/main" ] && [ "${CURRENT_REF}" != "refs/heads/master" ]; then
            echo "::error::Release workflow must be triggered from default branch ('main' or 'master'). Current ref: ${CURRENT_REF}"
            exit 1
          fi
          
          echo "✓ Confirmation phrase validated: '${CONFIRM_RELEASE}'"
          echo "✓ Running on authorized branch: ${CURRENT_REF}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Extract & Validate Project Versions
        id: version_check
        run: |
          python3 release_tools/validate_version.py --github-output

      - name: Check for Existing Git Tag & Release Collision
        env:
          TAG: ${{ steps.version_check.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if release or tag '${TAG}' already exists..."
          
          # Check existing GitHub release
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::GitHub Release '${TAG}' already exists. Release already published. Workflow stopped safely to prevent accidental overwrite."
            exit 1
          fi
          
          # Check local and remote tags
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::warning::Tag '${TAG}' already exists locally."
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "::warning::Tag '${TAG}' already exists on remote origin (release not yet published)."
          else
            echo "✓ Tag '${TAG}' is novel and available for publication."
          fi

      - name: Install System Dependencies for Headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          echo "Running full Python test suite before release..."
          pytest -v --tb=short

      - name: Install Node Dependencies (Reproducible)
        run: npm ci

      - name: Lint Frontend (TypeScript)
        run: npm run lint

      - name: Build Web Companion
        run: |
          npm run build
          # Package standalone Web Companion release archive
          VERSION="${{ steps.version_check.outputs.version }}"
          mkdir -p dist_artifacts
          tar -czf "dist_artifacts/RIATA_${VERSION}_web_companion.tar.gz" -C dist .
          echo "✓ Packaged standalone Web Companion archive"

      - name: Build Native Ubuntu Package (.deb)
        id: build_deb
        run: |
          python3 release_tools/build_deb.py --output-dir dist_artifacts
          
          DEB_FILE="dist_artifacts/${{ steps.version_check.outputs.deb_name }}"
          CHECKSUM=$(sha256sum "${DEB_FILE}" | awk '{print $1}')
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Verify Package Structure & Metadata
        run: |
          DEB_FILE="dist_artifacts/${{ steps.version_check.outputs.deb_name }}"
          python3 release_tools/verify_deb.py "${DEB_FILE}" \
            --expected-version "${{ steps.version_check.outputs.version }}" \
            --checksum-file dist_artifacts/SHA256SUMS

      - name: Installation Smoke Test on Ubuntu Runner
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          DEB_FILE="dist_artifacts/${{ steps.version_check.outputs.deb_name }}"
          echo "Installing package into runner via dpkg..."
          sudo dpkg -i "${DEB_FILE}"
          
          echo "Verifying package status with dpkg-query..."
          dpkg -s riata | grep "Status: install ok installed"
          
          echo "Executing installed binary and runtime smoke test..."
          python3 release_tools/verify_deb.py "${DEB_FILE}" \
            --expected-version "${{ steps.version_check.outputs.version }}" \
            --smoke-test

      - name: Upload Package Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: RIATA-${{ steps.version_check.outputs.version }}-artifacts
          path: dist_artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release & Git Tag (Atomic & Retry-Safe)
        env:
          TAG: ${{ steps.version_check.outputs.tag }}
          VERSION: ${{ steps.version_check.outputs.version }}
          DEB_NAME: ${{ steps.version_check.outputs.deb_name }}
          CHECKSUM: ${{ steps.build_deb.outputs.checksum }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<EOF > release_notes.md
          ## RIATA v${VERSION}

          Responsive Intent Automation & Task Assistant for Ubuntu Linux.
          Deterministic, rule-based desktop assistant supporting Persian and English with multi-step planning and contextual memory.

          ### 📦 Native Release Artifacts
          | File | Target Architecture | Description |
          |---|---|---|
          | \`${DEB_NAME}\` | \`amd64\` (x86_64) | Native Ubuntu / Debian installable package |
          | \`RIATA_${VERSION}_web_companion.tar.gz\` | Any | Web Companion standalone production bundle |
          | \`SHA256SUMS\` | All | Cryptographic SHA-256 verification sums |
          | \`${DEB_NAME}.sha256\` | All | Standalone checksum file for Debian package |

          ### 🔑 Primary Package Checksum (SHA-256)
          \`\`\`text
          ${CHECKSUM}  ${DEB_NAME}
          \`\`\`

          ### 🚀 Quick Install (Ubuntu / Debian)
          \`\`\`bash
          # Download and install the native Debian package:
          sudo apt install ./${DEB_NAME}
          # Or using dpkg:
          sudo dpkg -i ${DEB_NAME}
          \`\`\`

          ### 💡 Launching RIATA
          \`\`\`bash
          # Graphical Desktop GUI (PySide6):
          riata

          # Interactive CLI Console:
          riata --cli

          # Safe Simulation Mode (Dry-Run):
          riata --dry-run

          # Persistent Local Web Companion Server:
          riata --server --port 5005

          # Query Version:
          riata --version
          \`\`\`

          ### 🛡️ Build & Quality Verification
          - **Source Version:** \`${VERSION}\`
          - **Git Reference:** \`${TAG}\` (\`${{ github.sha }}\`)
          - **Builder Environment:** Ubuntu Linux (\`ubuntu-latest\`)
          - **Python Test Suite:** PASS (pytest with headless offscreen Qt)
          - **Frontend Companion:** PASS (TypeScript lint & Vite production build)
          - **Debian Package Integrity:** PASS (\`dpkg-deb\` control metadata & payload audit)
          - **Host Smoke Test:** PASS (\`riata --version\` & PySide6 offscreen initialization)
          EOF

          # gh release create handles creating the git tag at target commit and attaching artifacts atomically
          gh release create "${TAG}" \
            "dist_artifacts/${DEB_NAME}" \
            "dist_artifacts/RIATA_${VERSION}_web_companion.tar.gz" \
            "dist_artifacts/SHA256SUMS" \
            "dist_artifacts/${DEB_NAME}.sha256" \
            --target "${{ github.sha }}" \
            --title "RIATA ${TAG}" \
            --notes-file release_notes.md \
            --generate-notes

          echo "✓ Successfully created GitHub Release and Tag for '${TAG}' at commit ${{ github.sha }}"

      - name: Write GitHub Step Summary
        if: always()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 RIATA Release Workflow Summary

          | Metric / Stage | Status | Details |
          |---|---|---|
          | **Version** | ✅ Validated | \`${{ steps.version_check.outputs.version || 'Unknown' }}\` |
          | **Git Tag** | ✅ Configured | \`${{ steps.version_check.outputs.tag || 'Unknown' }}\` |
          | **Commit** | 📌 Pinned | \`${{ github.sha }}\` |
          | **Ubuntu Package** | 📦 Built | \`${{ steps.version_check.outputs.deb_name || 'N/A' }}\` |
          | **Web Companion** | 🌐 Bundled | \`RIATA_${{ steps.version_check.outputs.version || '0.2.0' }}_web_companion.tar.gz\` |
          | **Architecture** | 🖥️ amd64 | Linux x86_64 native |
          | **SHA-256 Hash** | 🔑 Verified | \`${{ steps.build_deb.outputs.checksum || 'N/A' }}\` |
          | **Python Tests** | ✅ PASS | Pytest test suite executed cleanly |
          | **Frontend Build** | ✅ PASS | TypeScript typecheck and Vite build succeeded |
          | **Package Validation** | ✅ PASS | Control metadata and payload paths verified |
          | **Smoke Test** | ✅ PASS | Installed binary & PySide6 offscreen test passed |
          | **GitHub Release** | 🚀 PUBLISHED | Tag and release published atomically |
          EOF
